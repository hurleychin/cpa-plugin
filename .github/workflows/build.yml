# CPA plugin build & release (workbuddy, linux/amd64 only for fast builds).
#   - tag 'v<version>'   → release workbuddy at that version
#   - workflow_dispatch  → pick plugin + version manually
#   - plain push/PR      → CI builds (artifacts only, no release)
#
# The release tag must be a plain version (e.g. v0.0.1). CPA's pluginstore
# derives the plugin version from the release tag directly (after stripping a
# leading v), so tags like <id>-v<version> fail its validation.
#
# Asset naming matches CLIProxyAPI pluginstore ArchiveName():
#   <id>_<version>_<goos>_<goarch>.zip   (zip root: <id>.so)

name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      plugin:
        description: "Plugin to release"
        required: true
        type: choice
        options: [workbuddy]
      version:
        description: "Version without v (empty = plugin's VERSION file)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.dir }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: workbuddy
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache-dependency-path: ${{ matrix.dir }}/go.sum
      - name: Validate registry.json
        working-directory: .
        run: python3 scripts/validate-registry.py registry.json
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  build:
    name: ${{ matrix.id }} ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # workbuddy native (linux/amd64 only for speed)
          - id: workbuddy
            goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            ext: so
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.id }}/go.mod
          cache-dependency-path: ${{ matrix.id }}/go.sum

      - name: Resolve release metadata
        working-directory: .
        run: |
          set -euo pipefail
          PLUGIN="${{ matrix.id }}"
          # Version resolution: release tag (v<version>) > dispatch input > VERSION file
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ github.event.inputs.version }}" ] && [ "${{ github.event.inputs.plugin }}" == "${PLUGIN}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="$(tr -d ' \n\r' < ${PLUGIN}/VERSION)"
            # CI builds (non-release) get a +ci suffix to avoid clashing with real versions
            if [[ "${GITHUB_REF_TYPE:-}" != "tag" && "${{ github.event_name }}" != "workflow_dispatch" ]]; then
              VERSION="${VERSION}+ci.${GITHUB_RUN_NUMBER}"
            fi
          fi
          CLEAN_VERSION="${VERSION%%+*}"
          echo "VERSION=${CLEAN_VERSION}" >> "${GITHUB_ENV}"
          echo "LIB_NAME=${PLUGIN}.${{ matrix.ext }}" >> "${GITHUB_ENV}"
          echo "ARCHIVE_NAME=${PLUGIN}_${CLEAN_VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" >> "${GITHUB_ENV}"
          echo "version=${CLEAN_VERSION} archive=${PLUGIN}_${CLEAN_VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"

      - name: Build shared library
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -buildmode=c-shared \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${LIB_NAME}" .
          rm -f "dist/${{ matrix.id }}.h" dist/*.h || true
          file "dist/${LIB_NAME}" || true

      - name: Package plugin (CPA ArchiveName)
        working-directory: .
        run: |
          set -euo pipefail
          go run ./.github/scripts/package-release.go \
            -library "${{ matrix.id }}/dist/${LIB_NAME}" \
            -archive "${ARCHIVE_NAME}" \
            -checksum "${ARCHIVE_NAME}.sha256"
          python3 - <<'PY'
          import zipfile, os, sys
          name = os.environ["ARCHIVE_NAME"]
          lib = os.environ["LIB_NAME"]
          with zipfile.ZipFile(name) as z:
              names = z.namelist()
              print("zip entries:", names)
              if lib not in names:
                  sys.exit(f"zip root missing {lib}: {names}")
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error


  release:
    name: Release
    # Only for a release tag (v<version>), or dispatch with a version.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '') ||
      startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve plugin + version
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            P="${{ github.event.inputs.plugin }}"
            V="${{ github.event.inputs.version }}"
          else
            P="workbuddy"; V="${GITHUB_REF_NAME#v}"
          fi
          echo "plugin=$P" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v${V}" >> "$GITHUB_OUTPUT"
          echo "Releasing $P v$V"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Assemble checksums.txt (this plugin only)
        env:
          PLUGIN: ${{ steps.meta.outputs.plugin }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          mv dist/${PLUGIN}_${VERSION}_*.zip* out/ 2>/dev/null || true
          ls -la out/
          if ls out/*.sha256 >/dev/null 2>&1; then
            sort out/*.sha256 > out/checksums.txt
          else
            (cd out && sha256sum *.zip > checksums.txt)
          fi
          cat out/checksums.txt
          test -f "out/${PLUGIN}_${VERSION}_linux_amd64.zip" || { echo "missing ${PLUGIN}_${VERSION}_linux_amd64.zip"; exit 1; }

      - name: Sync registry.json version (this plugin only)
        env:
          PLUGIN: ${{ steps.meta.outputs.plugin }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          pid, v = os.environ["PLUGIN"], os.environ["VERSION"]
          p = pathlib.Path("registry.json")
          data = json.loads(p.read_text())
          for plug in data.get("plugins", []):
              if plug.get("id") == pid:
                  plug["version"] = v
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
          print(p.read_text())
          PY
          python3 scripts/validate-registry.py registry.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          PLUGIN: ${{ steps.meta.outputs.plugin }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              git tag -a "${TAG}" -m "Release ${PLUGIN} ${TAG}"
              git push origin "${TAG}"
            fi
          fi
          gh release create "${TAG}" out/${PLUGIN}_${VERSION}_linux_amd64.zip out/checksums.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${PLUGIN} v${VERSION}" \
            --notes "${PLUGIN} CPA plugin v${VERSION} - Linux amd64 build for CLIProxyAPI plugin store"
